name: Mindstate Design Labs
description: 'Mindstate Design Labs is a clinical-stage AI neuroengineering platform and drug
  development company addressing the mental health crisis. Its Osmanthus discovery platform maps
  the biological basis of emotion, perception, and cognition by analyzing psychoactive drug effects
  and biochemical data to understand how neurotransmitter combinations produce different emotional
  and cognitive states, driving a pipeline of novel mental-health therapeutics. Backed by Initialized
  Capital. As of this enrichment pass the company publishes an informational corporate site only and
  exposes no public developer API, documentation portal, or specification surface.'
